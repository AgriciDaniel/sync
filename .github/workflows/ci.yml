name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Compile
        run: python -m compileall scripts sync_brain tests
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy .
      - name: Secret scan
        run: git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline
      - name: CLI smoke
        run: sync-brain --help
      - name: Template vault lint
        run: python scripts/lint_vault.py --vault assets/template-brain --template
      - name: Pytest
        run: python -m pytest -q
      - name: Pipeline tests
        run: python tests/test_pipeline.py
      - name: Demo vault drift
        run: |
          python scripts/build_demo_vault.py --verify-determinism
          git diff --exit-code -- examples/sample-vault
      - name: Release package and audit
        run: |
          python scripts/audit_brain.py --require market-ready --json
          python scripts/package_release.py --version 1.0.1 --release-type market-ready
