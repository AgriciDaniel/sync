repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: "(^|/)(dist|\\.mypy_cache|\\.pytest_cache|\\.ruff_cache|__pycache__)/|^\\.secrets\\.baseline$|^references/verification/market-ready\\.json$"
